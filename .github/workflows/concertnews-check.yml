name: concertnews-check
# T0 (SPEC-3): one-off check that concert-news.de answers from GitHub. Replaced by concertnews.yml in T17.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl concert-news
        run: |
          code=$(curl -s -o page.html -w '%{http_code}' -m 60 \
            -A 'Mozilla/5.0 (compatible; hamburg-clubnacht/0.1)' \
            https://www.concert-news.de/konzertkalender/)
          echo "HTTP $code, $(wc -c < page.html) bytes"
          grep -c 'id="myFuture"' page.html || true
          test "$code" = 200 && grep -q 'id="myFuture"' page.html
